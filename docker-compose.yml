services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: spatial-postgis
    environment:
      POSTGRES_DB: spatialdb
      POSTGRES_USER: spatial
      POSTGRES_PASSWORD: ${DB_PASS:-spatial1234}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatial -d spatialdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  geoserver:
    image: docker.osgeo.org/geoserver:2.26.2
    container_name: spatial-geoserver
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      INSTALL_EXTENSIONS: "true"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      GEOSERVER_ADMIN_USER: ${GEOSERVER_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_PASS:-geoserver}
    ports:
      - "8600:8080"

