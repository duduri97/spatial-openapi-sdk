services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: spatial-postgis
    environment:
      POSTGRES_DB: spatialdb
      POSTGRES_USER: spatial
      POSTGRES_PASSWORD: ${DB_PASS:-spatial1234}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatial -d spatialdb"]
      interval: 5s
      timeout: 5s
      retries: 10
