spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spatialdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:spatial}
spring.datasource.password=${DB_PASS:spatial1234}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
