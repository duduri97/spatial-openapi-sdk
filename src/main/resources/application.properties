spring.application.name=spatial-openapi-sdk
server.port=8080

# Default H2 in-memory DB for zero-config local execution & CI
spring.datasource.url=jdbc:h2:mem:spatialdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Demo API key seeded on startup for immediate SDK playground usage
spatial.demo.api-key=demo-spatial-key-2026
